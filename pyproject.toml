[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarm-observer"
version = "0.1.0"
description = "Post-hoc observability for multi-agent AI runs: normalize agent traces, detect waste, price the calls, render a self-contained report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "swarm-observer developers" }]
dependencies = [
    "pydantic >= 2.7, < 3",
]

[project.optional-dependencies]
# R45: `explain` is never required. The offline suite runs with `anthropic`
# absent, and nothing in the package imports it outside
# `narrate/adapters/anthropic.py` (R44), which lands in increment 5.
explain = [
    "anthropic >= 0.30, < 1",
]
dev = [
    "pytest >= 8, < 9",
    "pytest-cov",
    "ruff >= 0.5",
    "mypy >= 1.10",
]

[project.scripts]
swarm-observer = "swarm_observer.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["swarm_observer"]

# Package data (R26): `swarm_observer/cost/data/model_rates.json` ships inside
# the package directory and needs no extra build configuration; it arrives with
# increment 3.

[tool.ruff]
line-length = 100
target-version = "py311"
# `docs/` holds the approved spec and the PR write-ups. Recent ruff versions
# reformat Python blocks inside Markdown, which would rewrite a ratified
# document to satisfy a formatter; the spec is the input to this repo, not its
# output.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["swarm_observer"]

# R45: `anthropic` is the `[explain]` extra and is deliberately absent from the
# environment CI type-checks in, so `narrate/adapters/anthropic.py`'s lazy
# import has no stub to resolve. An `ignore_missing_imports` override rather
# than an inline `# type: ignore`: strict mode's `warn_unused_ignores` would
# turn the inline form red in an environment where the extra *is* installed,
# which is the one place a developer most wants the checker working.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_narrator: sends a real narrator request to a provider (R41, R43); always deselected in CI",
]
